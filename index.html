<body>

    <div class="dri-products-container" id="driProductsGrid"></div>

    <script>
    // ===== 数据驱动渲染：优先读取后台管理页(admin.html)保存的数据(localStorage)，否则使用 data.js =====
    function getSiteData() {
        // 服务器数据（data.js 由 Cloudflare Worker 动态返回）优先，其次才是本机缓存
        if (window.SITE_DATA && window.SITE_DATA.products && window.SITE_DATA.products.length) return window.SITE_DATA;
        try {
            var saved = JSON.parse(localStorage.getItem('siteDataV1'));
            if (saved && saved.products && saved.products.length) return saved;
        } catch (e) {}
        return window.SITE_DATA || { settings: {}, products: [] };
    }
    function siteSettings() { return getSiteData().settings || {}; }
    function waNumber() { return String(siteSettings().whatsapp || '').replace(/[^0-9]/g, ''); }
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
    }
    (function renderProducts() {
        var data = getSiteData();
        var grid = document.getElementById('driProductsGrid');
        var out = '';
        (data.products || []).forEach(function(p) {
            var tagHtml = p.tag ? '<div class="dri-product-tag">' + esc(p.tag) + '</div>' : '';
            out += '<div class="dri-product" data-category="' + esc(p.category) + '">' +
                tagHtml +
                '<div class="dri-product-img-container">' +
                    '<img src="' + esc(p.image) + '" class="dri-product-img" alt="' + esc(p.title) + '" loading="lazy">' +
                    (p.video ? '<div class="dri-play-overlay" data-video="' + esc(p.video) + '">' +
                        '<div class="dri-play-icon"><i class="fas fa-play-circle"></i></div>' +
                    '</div>' : '') +
                '</div>' +
                '<div class="dri-product-info">' +
                    '<h3 class="dri-product-title">' + esc(p.title) + '</h3>' +
                    '<p class="dri-product-price">' + esc(p.price) + '</p>' +
                    '<p class="dri-product-desc">' + esc(p.desc) + '</p>' +
                    '<button class="dri-whatsapp-btn" data-id="' + esc(p.id) + '" data-name="' + esc(p.sku) + '" data-price="' + esc(p.price) + '">' +
                        '<i class="fab fa-whatsapp"></i> WhatsApp Order' +
                    '</button>' +
                '</div>' +
            '</div>';
        });
        grid.innerHTML = out;
    })();
    </script>

          </button>

    <script>
        let cart = [];
        const cartBadge = document.querySelector('.dri-cart-badge');
        const cartNotification = document.querySelector('.dri-cart-notification');
        function updateCartIndicator() { cartBadge.textContent = cart.length; }
        function showNotification() {
            cartNotification.classList.add('active');
            setTimeout(() => { cartNotification.classList.remove('active'); }, 2000);
        }
        const videoModal = document.querySelector('.dri-video-modal');
        const videoPlayer = document.querySelector('.dri-video-player');
        const closeModal = document.querySelector('.dri-close-modal');
        const playOverlays = document.querySelectorAll('.dri-play-overlay');
        playOverlays.forEach(overlay => {
            overlay.addEventListener('click', () => {
                const videoSrc = overlay.getAttribute('data-video');
                if (!videoSrc) { return; }
                while(videoPlayer.firstChild) { videoPlayer.removeChild(videoPlayer.firstChild); }
                const source = document.createElement('source');
                source.src = videoSrc;
                source.type = 'video/mp4';
                videoPlayer.appendChild(source);
                videoPlayer.load();
                videoModal.classList.add('active');
                videoPlayer.play();
            });
        });
        closeModal.addEventListener('click', () => {
            videoModal.classList.remove('active');
            videoPlayer.pause();
        });
        videoModal.addEventListener('click', (e) => {
            if (e.target === videoModal) {
                videoModal.classList.remove('active');
                videoPlayer.pause();
            }
        });
        const whatsappButtons = document.querySelectorAll('.dri-whatsapp-btn');
        const confirmModal = document.querySelector('.dri-confirm-modal');
        const cancelBtn = document.querySelector('.dri-confirm-cancel');
        const proceedBtn = document.querySelector('.dri-confirm-proceed');
        const confirmProductName = document.getElementById('confirmProductName');
        let currentWhatsappUrl = null;
        let currentPrice = null;
        whatsappButtons.forEach(button => {
            button.addEventListener('click', function() {
                const productTitle = this.getAttribute('data-name');
                const productPrice = this.getAttribute('data-price');
                currentPrice = parseFloat(productPrice);
                cart.push({ id: this.getAttribute('data-id'), title: productTitle, price: productPrice });
                updateCartIndicator();
                showNotification();
                var _tpl = siteSettings().orderMessage || 'Hello ! Please order: {name} (AED {price})';
                const message = _tpl.replace('{name}', productTitle).replace('{price}', productPrice).replace('{link}', siteSettings().websiteLink || '');
                currentWhatsappUrl = `https://wa.me/${waNumber()}?text=${encodeURIComponent(message)}`;
                confirmProductName.textContent = productTitle;
                confirmModal.classList.add('active');
            });
        });
        proceedBtn.addEventListener('click', () => {
            if (currentPrice) { fbq('track', 'Purchase', { value: currentPrice, currency: 'AED' }); }
            else { fbq('track', 'Purchase', { value: 200, currency: 'AED' }); }
            if (currentWhatsappUrl) { window.open(currentWhatsappUrl, '_blank'); }
            confirmModal.classList.remove('active');
            cart = [];
            updateCartIndicator();
        });
        cancelBtn.addEventListener('click', () => { confirmModal.classList.remove('active'); });
        confirmModal.addEventListener('click', (e) => { if (e.target === confirmModal) confirmModal.classList.remove('active'); });
        const filterButtons = document.querySelectorAll('.dri-filter-btn');
        const products = document.querySelectorAll('.dri-product');
        const searchInput = document.getElementById('driSearch');
        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                const filter = button.getAttribute('data-filter');
                products.forEach(product => {
                    if (filter === 'all' || product.getAttribute('data-category').includes(filter)) {
                        product.style.display = 'block';
                        product.style.animation = 'fadeIn 0.5s ease-out';
                    } else { product.style.display = 'none'; }
                });
            });
        });
        searchInput.addEventListener('input', () => {
            const searchTerm = searchInput.value.toLowerCase();
            products.forEach(product => {
                const title = product.querySelector('.dri-product-title').textContent.toLowerCase();
                const desc = product.querySelector('.dri-product-desc').textContent.toLowerCase();
                if (title.includes(searchTerm) || desc.includes(searchTerm)) { product.style.display = 'block'; }
                else { product.style.display = 'none'; }
            });
        });
        updateCartIndicator();
    </script>

    <script>
    (function() {
        function getTrackId() {
            const params = new URLSearchParams(window.location.search);
            const rd = params.get('rd');
            if (!rd) return null;
            try {
                const decoded = atob(decodeURIComponent(rd));
                const parts = decoded.split('|');
                return parts[0] || null;
            } catch(e) { return null; }
        }
        const trackId = getTrackId();
        if (!trackId) return;
        function logConversion(productInfo) {
            const img = new Image(1,1);
            const params = new URLSearchParams({
                t: trackId,
                e: 'whatsapp_click',
                p: productInfo.id || 'unknown',
                n: encodeURIComponent(productInfo.name || 'product'),
                ts: Date.now(),
                r: Math.random().toString(36).substr(2, 6)
            });
            img.src = 'https://uaelovejune.com/Linh/pixel.gif?' + params.toString();
            img.style.display = 'none';
            document.body.appendChild(img);
        }
        document.addEventListener('click', function(e) {
            let target = e.target;
            while (target && target !== document) {
                const isWhatsAppBtn = 
                    (target.tagName === 'A' && target.href && 
                     (target.href.includes('whatsapp') || target.href.includes('wa.me'))) ||
                    (target.classList && 
                     (target.classList.contains('dri-whatsapp-btn') || 
                      target.classList.contains('whatsapp') ||
                      target.textContent.includes('WhatsApp')));
                if (isWhatsAppBtn) {
                    const productInfo = {
                        id: target.getAttribute('data-id') || target.getAttribute('id') || 'pid_' + Date.now(),
                        name: target.getAttribute('data-name') || target.textContent.trim().substring(0, 30)
                    };
                    logConversion(productInfo);
                    if (target.tagName === 'A' && target.href) {
                        e.preventDefault();
                        setTimeout(() => { window.open(target.href, '_blank'); }, 200);
                    }
                    break;
                }
                target = target.parentElement;
            }
        }, true);
        console.log('A站跟踪已激活');
    })();
    </script>

    <script>
    (function(){
      var pill = document.getElementById('driVideoClosePill');
      var modal = document.querySelector('.dri-video-modal');
      var player = document.querySelector('.dri-video-player');
      if(!pill || !modal) return;
      pill.addEventListener('click', function(e){
        e.stopPropagation();
        modal.classList.remove('active');
        if(player) player.pause();
      });
    })();
    </script>

    <script>
    (function(){
      var overlay = document.getElementById('driCartOverlay');
      var listEl = document.getElementById('driCartList');
      var totalEl = document.getElementById('driCartTotal');
      var closeBtn = document.getElementById('driCartClose');
      var waBtn = document.getElementById('driCartWhatsappBtn');

      var imageMap = {};
      document.querySelectorAll('.dri-product').forEach(function(product){
        var wa = product.querySelector('.dri-whatsapp-btn');
        var img = product.querySelector('.dri-product-img');
        if(wa && img){
          var k = (wa.getAttribute('data-id')||'') + '|' + (wa.getAttribute('data-name')||'Product');
          if(!imageMap[k]) imageMap[k] = img.src;
        }
      });

      document.querySelectorAll('.dri-product').forEach(function(product){
        var imgContainer = product.querySelector('.dri-product-img-container');
        var wa = product.querySelector('.dri-whatsapp-btn');
        if(!imgContainer || !wa) return;
        if(getComputedStyle(imgContainer).position === 'static') imgContainer.style.position = 'relative';
        var addBtn = document.createElement('button');
        addBtn.className = 'dri-quick-add-btn';
        addBtn.innerHTML = '<i class="fas fa-cart-plus"></i>';
        addBtn.title = 'Add to Cart';
        addBtn.addEventListener('click', function(e){
          e.preventDefault(); e.stopPropagation();
          var name = wa.getAttribute('data-name') || 'Product';
          var price = wa.getAttribute('data-price') || '0';
          var id = wa.getAttribute('data-id') || '';
          if(typeof cart !== 'undefined'){
            cart.push({id:id, title:name, price:price});
            if(typeof updateCartIndicator === 'function') updateCartIndicator();
            if(typeof showNotification === 'function') showNotification();
          }
          addBtn.classList.add('added');
          addBtn.innerHTML = '<i class="fas fa-check"></i>';
          setTimeout(function(){ addBtn.classList.remove('added'); addBtn.innerHTML = '<i class="fas fa-cart-plus"></i>'; }, 800);
        });
        imgContainer.appendChild(addBtn);
      });

      function aggregateCart(){
        var map = {}, order = [];
        (typeof cart !== 'undefined' ? cart : []).forEach(function(item){
          var key = (item.id || '') + '|' + (item.title || '');
          if(!map[key]){ map[key] = { id:item.id||'', title:item.title||'Product', price:parseFloat(item.price)||0, qty:0 }; order.push(key); }
          map[key].qty += 1;
        });
        return order.map(function(k){ return map[k]; });
      }
      function encodeKey(item){ return encodeURIComponent((item.id||'') + '|' + (item.title||'')); }
      function decodeKey(key){ var s = decodeURIComponent(key), i = s.indexOf('|'); return { id: s.substring(0,i), title: s.substring(i+1) }; }
      function escapeHtml(str){ return String(str).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
      function getImage(item){ return imageMap[(item.id||'') + '|' + (item.title||'Product')] || ''; }

      function renderCart(){
        var items = aggregateCart();
        listEl.innerHTML = '';
        if(items.length === 0){
          listEl.innerHTML = '<div class="dri-cart-empty"><i class="fas fa-shopping-cart"></i>Your cart is empty</div>';
          totalEl.textContent = 'AED 0.00'; waBtn.disabled = true; return;
        }
        waBtn.disabled = false;
        var total = 0;
        items.forEach(function(item){
          var subtotal = item.price * item.qty; total += subtotal;
          var src = getImage(item);
          var thumb = src ? '<div class="dri-cart-item-thumb"><img src="'+escapeHtml(src)+'" alt=""></div>' : '<div class="dri-cart-item-thumb"><i class="fas fa-box"></i></div>';
          var row = document.createElement('div');
          row.className = 'dri-cart-item';
          row.innerHTML = thumb +
            '<div class="dri-cart-item-info"><div class="dri-cart-item-name">'+escapeHtml(item.title)+'</div><div class="dri-cart-item-id">Item #'+escapeHtml(String(item.id))+'</div><div class="dri-cart-item-price">AED '+item.price.toFixed(2)+'</div></div>' +
            '<div class="dri-cart-qty"><button data-action="minus" data-key="'+encodeKey(item)+'">−</button><span>'+item.qty+'</span><button data-action="plus" data-key="'+encodeKey(item)+'">+</button></div>' +
            '<div class="dri-cart-item-subtotal">AED '+subtotal.toFixed(2)+'</div>' +
            '<button class="dri-cart-item-remove" data-action="remove" data-key="'+encodeKey(item)+'"><i class="fas fa-trash-alt"></i></button>';
          listEl.appendChild(row);
        });
        totalEl.textContent = 'AED ' + total.toFixed(2);
      }

      listEl.addEventListener('click', function(e){
        var btn = e.target.closest('button[data-action]'); if(!btn) return;
        var action = btn.getAttribute('data-action'); var target = decodeKey(btn.getAttribute('data-key'));
        if(typeof cart === 'undefined') return;
        if(action === 'plus'){ var f = cart.find(function(it){ return (it.id||'')===target.id && (it.title||'')===target.title; }); if(f) cart.push({id:f.id,title:f.title,price:f.price}); }
        else if(action === 'minus'){ var i = cart.findIndex(function(it){ return (it.id||'')===target.id && (it.title||'')===target.title; }); if(i>-1) cart.splice(i,1); }
        else if(action === 'remove'){ for(var j=cart.length-1;j>=0;j--){ if((cart[j].id||'')===target.id && (cart[j].title||'')===target.title) cart.splice(j,1); } }
        if(typeof updateCartIndicator === 'function') updateCartIndicator();
        renderCart();
      });

      function openCart(){ renderCart(); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
      function closeCart(){ overlay.classList.remove('active'); document.body.style.overflow = ''; }
      closeBtn.addEventListener('click', closeCart);
      overlay.addEventListener('click', function(e){ if(e.target === overlay) closeCart(); });

      var footerNav = document.querySelector('.dri-footer-nav');
      if(footerNav){
        var cartNavBtn = footerNav.querySelector('.dri-nav-btn:last-child');
        if(cartNavBtn) cartNavBtn.addEventListener('click', function(e){ e.preventDefault(); openCart(); });
      }

      waBtn.addEventListener('click', function(){
        var items = aggregateCart(); if(items.length === 0) return;
        var lines = [], total = 0;
        items.forEach(function(item, idx){
          var sub = item.price * item.qty; total += sub;
          lines.push((idx+1) + '. ' + item.title + ' x ' + item.qty + ' - AED ' + sub.toFixed(2));
        });
        lines.push('Total: AED ' + total.toFixed(2));
        var _foot = (typeof siteSettings === 'function' ? (siteSettings().cartFooter || 'Private delivery protect privacy. Website: {link}') : '');
        lines.push(_foot.replace('{link}', (typeof siteSettings === 'function' ? siteSettings().websiteLink : '') || ''));
        var _num = (typeof waNumber === 'function' ? waNumber() : '');
        var url = 'https://wa.me/' + _num + '?text=' + encodeURIComponent(lines.join('\n'));
        if(typeof fbq === 'function') fbq('track', 'Purchase', { value: total, currency: 'AED' });
        window.open(url, '_blank');
        if(typeof cart !== 'undefined') cart.length = 0;
        if(typeof updateCartIndicator === 'function') updateCartIndicator();
        closeCart();
      });

      if(typeof updateCartIndicator === 'function') updateCartIndicator();
    })();
    </script>
<style>
:root {
  --lux-bg:      #F7F4EF;
  --lux-surface: #FFFFFF;
  --lux-text:    #1C1A16;
  --lux-muted:   #6B635B;
  --lux-accent:  #1F5C4A;
  --lux-line:    #E4DDD3;
}
body { background: var(--lux-bg) !important; color: var(--lux-text) !important; }
.dri-header h1 { color: var(--lux-text) !important; }
.dri-header small { color: var(--lux-accent) !important; }
.dri-product { background: var(--lux-surface) !important; border: 1px solid var(--lux-line) !important; }
.dri-product-title, .dri-product-price { color: var(--lux-text) !important; }
